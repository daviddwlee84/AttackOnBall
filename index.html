<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7ed957" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Attack on Ball</title>
    <meta
      name="description"
      content="Dodge the bouncing balls as long as you can! A doodle-style arcade game you can play right in your browser."
    />

    <!-- iOS / installed standalone appearance -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Attack on Ball" />

    <!-- Open Graph (absolute URLs required by social scrapers) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Attack on Ball" />
    <meta property="og:title" content="Attack on Ball" />
    <meta
      property="og:description"
      content="Dodge the bouncing balls as long as you can! A doodle-style arcade game in your browser."
    />
    <meta property="og:url" content="https://daviddwlee84.github.io/AttackOnBall/" />
    <meta property="og:image" content="https://daviddwlee84.github.io/AttackOnBall/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="Attack on Ball — doodle-style arcade game" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Attack on Ball" />
    <meta name="twitter:description" content="Dodge the bouncing balls as long as you can!" />
    <meta name="twitter:image" content="https://daviddwlee84.github.io/AttackOnBall/og-image.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1c1a17;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        /* Suppress the iOS long-press "Copy | Translate" callout / text selection
           that interrupts play. */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        font-family: 'Comic Sans MS', 'Marker Felt', sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Software landscape: when the device is held in portrait and the browser
         won't let us lock the orientation (iOS Safari), we rotate the whole page
         90° instead of asking the player to turn the phone. `position: fixed`
         children resolve against the transformed body, so the settings panel and
         banners come along for the ride. --aob-vw/--aob-vh are set from JS
         (window.innerWidth/Height) rather than vw/vh units, which are unreliable
         on mobile while the URL bar animates.
         src/orientation.js owns the class and patches Phaser's pointer mapping. */
      body.aob-rotated {
        width: var(--aob-vh);
        height: var(--aob-vw);
        transform-origin: top left;
      }
      /* Which way the phone gets turned is not detectable when the OS rotation
         lock is on, so both directions are available (settings toggle). */
      body.aob-rotated.aob-cw {
        transform: rotate(90deg) translateY(-100%);
      }
      body.aob-rotated.aob-ccw {
        transform: rotate(-90deg) translateX(-100%);
      }
      body.aob-rotated #game {
        width: var(--aob-vh);
        height: var(--aob-vw);
      }

      /* Rotate-to-landscape prompt: last-resort fallback, shown only when
         src/orientation.js could neither lock the orientation nor rotate the
         page itself (body.aob-needs-rotate). */
      #aob-rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #fdf6e3;
        color: #2b2b2b;
        text-align: center;
      }
      #aob-rotate .phone {
        width: 64px;
        height: 110px;
        border: 5px solid #2b2b2b;
        border-radius: 14px;
        background: #9ad42b;
        animation: aob-rotate-spin 1.6s ease-in-out infinite;
      }
      #aob-rotate .label {
        font-size: 24px;
        font-weight: bold;
        line-height: 1.4;
        letter-spacing: 0.5px;
      }
      @keyframes aob-rotate-spin {
        0%,
        30% {
          transform: rotate(0deg);
        }
        70%,
        100% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        body.aob-needs-rotate #aob-rotate {
          display: flex;
        }
      }

      /* "Add to Home Screen" install banner (toggled by src/pwa-install.js). */
      #aob-install {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 25;
        max-width: 92vw;
        padding: 10px 14px;
        align-items: center;
        gap: 12px;
        background: #2b2b2b;
        color: #fdf6e3;
        border: 3px solid #fdf6e3;
        border-radius: 12px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        font-size: 15px;
      }
      #aob-install.aob-show {
        display: flex;
      }
      #aob-install .text {
        flex: 1;
        line-height: 1.35;
      }
      #aob-install button {
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        border: 2px solid #2b2b2b;
        padding: 7px 12px;
      }
      #aob-install .install-btn {
        background: #7ed957;
        color: #14310a;
      }
      #aob-install .dismiss-btn {
        background: transparent;
        color: #fdf6e3;
        border-color: #fdf6e3;
        padding: 7px 10px;
      }

      /* "New version" toast (toggled by src/pwa-update.js). Sits at the top and
         above the settings panel (z-index 10) and name prompt (40), because it
         is only ever shown on the menu / game-over screens — never mid-run. */
      #aob-update {
        display: none;
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        z-index: 50;
        max-width: 92vw;
        padding: 10px 14px;
        align-items: center;
        gap: 12px;
        background: #fdf6e3;
        color: #2b2b2b;
        border: 3px solid #2b2b2b;
        border-radius: 12px;
        box-shadow: 0 4px 0 rgba(43, 43, 43, 0.3);
        font-size: 15px;
      }
      #aob-update.aob-show {
        display: flex;
      }
      #aob-update .text {
        flex: 1;
        line-height: 1.35;
        font-weight: bold;
      }
      #aob-update button {
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        border: 2px solid #2b2b2b;
        padding: 7px 12px;
      }
      #aob-update .update-btn {
        background: #7ed957;
        color: #14310a;
      }
      #aob-update .later-btn {
        background: transparent;
        padding: 7px 10px;
      }

      /* Loading screen shown immediately while the bundle downloads and the
         doodle textures are generated; removed once the menu is ready. */
      #aob-loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #fdf6e3;
        color: #2b2b2b;
        transition: opacity 0.35s ease;
      }
      #aob-loading.aob-fade {
        opacity: 0;
        pointer-events: none;
      }
      #aob-loading .ball {
        width: 56px;
        height: 56px;
        border: 5px solid #2b2b2b;
        border-radius: 50%;
        background: #9ad42b;
        animation: aob-bounce 0.6s cubic-bezier(0.5, 0.05, 0.5, 1) infinite alternate;
      }
      #aob-loading .label {
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 1px;
      }
      @keyframes aob-bounce {
        from {
          transform: translateY(-26px) scaleY(1.05);
        }
        to {
          transform: translateY(26px) scaleX(1.12) scaleY(0.88);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="aob-loading">
      <div class="ball"></div>
      <div class="label">Loading…</div>
    </div>
    <div id="aob-rotate" aria-hidden="true">
      <div class="phone"></div>
      <div class="label">Rotate your device<br />to landscape&nbsp;↺</div>
    </div>
    <div id="aob-update" role="dialog" aria-label="Update available">
      <span class="text">🔄 New version available</span>
      <button type="button" class="update-btn">Update</button>
      <button type="button" class="later-btn" aria-label="Later">Later</button>
    </div>
    <div id="aob-install" role="dialog" aria-label="Install Attack on Ball">
      <span class="text"></span>
      <button type="button" class="install-btn">Install</button>
      <button type="button" class="dismiss-btn" aria-label="Dismiss">✕</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
