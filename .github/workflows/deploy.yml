name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, but never cancel one that is already running.
#
# This used to be `cancel-in-progress: true`, which is actively harmful for
# Pages: cancelling a run mid-deploy leaves the Pages deployment itself wedged
# (we ended up with several stuck in `deployment_cancelled`, and one in an empty
# state that then rejected every later deployment with "due to in progress
# deployment"). Because the deployment id *is* the commit SHA, a wedged one
# can't simply be retried either. GitHub's own Pages starter workflow uses
# `false` for exactly this reason.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (with GitHub Pages base path)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
